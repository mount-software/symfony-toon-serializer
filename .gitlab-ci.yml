# Test on PHP 8.4 (latest)
test:php8.4:
  stage: test
  image: php:8.4-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - php -r "unlink('composer-setup.php');"
    - composer install --no-interaction --prefer-dist --optimize-autoloader
  script:
    - vendor/bin/phpunit --testdox

# Code Quality Checks
quality:syntax:
  stage: quality
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - php -r "unlink('composer-setup.php');"
    - composer install --no-interaction --prefer-dist
  script:
    # Check PHP syntax
    - find src tests -name "*.php" -print0 | xargs -0 -n1 php -l
  allow_failure: false

# Validate composer.json
quality:composer:
  stage: quality
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - php -r "unlink('composer-setup.php');"
  script:
    - composer validate --strict --no-check-lock
  allow_failure: false

# Security check
quality:security:
  stage: quality
  image: php:8.1-cli
  before_script:
    - apt-get update && apt-get install -y git unzip
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - php -r "unlink('composer-setup.php');"
    - composer install --no-interaction --prefer-dist
  script:
    - composer audit || true
  allow_failure: true

# Create release (only on tags)
release:packagist:
  stage: release
  image: php:8.1-cli
  only:
    - tags
  script:
    - echo "Release $CI_COMMIT_TAG created"
    - echo "Packagist will auto-update via webhook"
    - echo "Package URL - https://packagist.org/packages/mountsoftware/symfony-toon-serializer"
  artifacts:
    name: "symfony-toon-serializer-$CI_COMMIT_TAG"
    paths:
      - src/
      - composer.json
      - README.md
      - LICENSE
